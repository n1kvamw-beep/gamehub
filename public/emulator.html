<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>GameHub — Emulador</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfd2e3;font-family:system-ui,sans-serif;overflow:hidden}
  #game{width:100%;height:100%}
  #msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.6;pointer-events:none}
  #msg.hide{display:none}
</style>
</head>
<body>
<div id="game"></div>
<script>addEventListener("message",function(e){var d=e.data;if(!d||d.gh!=="key"||e.source!==window.parent)return;var ev=new KeyboardEvent(d.type==="u"?"keyup":"keydown",{key:d.key,code:d.code,bubbles:true,cancelable:true});try{Object.defineProperty(ev,"keyCode",{get:function(){return d.kc}});Object.defineProperty(ev,"which",{get:function(){return d.kc}})}catch(x){}var t=document.querySelector("canvas")||document.activeElement||document.body;t.dispatchEvent(ev)});</script>
<script>
/* Sala online: expõe o ecrã e o som do emulador para o anfitrião os enviar por WebRTC. */
(function(){ try {
  var oc = AudioNode.prototype.connect;
  AudioNode.prototype.connect = function (d) {
    var r = oc.apply(this, arguments);
    try {
      if (window.AudioDestinationNode && d instanceof AudioDestinationNode) {
        var ctx = d.context;
        if (!ctx.__ghTee) { ctx.__ghTee = ctx.createMediaStreamDestination(); window.__ghAudio = ctx.__ghTee; }
        oc.call(this, ctx.__ghTee);
      }
    } catch (x) {}
    return r;
  };
  window.__ghStream = function () {
    var c = null, best = 0, all = document.querySelectorAll("canvas");
    for (var i = 0; i < all.length; i++) { var a = all[i].width * all[i].height; if (a > best) { best = a; c = all[i]; } }
    if (!c || !c.captureStream) return null;
    var s = c.captureStream(60);
    if (window.__ghAudio) window.__ghAudio.stream.getAudioTracks().forEach(function (t) { s.addTrack(t); });
    return s;
  };
} catch (e) {} })();
</script>
<div id="msg">A preparar o emulador…</div>
<script>
(function () {
  var msg = document.getElementById("msg");
  function fail(t) { msg.className = ""; msg.textContent = t; }
  var q = new URLSearchParams(location.search);
  var core = q.get("core"), url = q.get("url"), name = q.get("name") || "Jogo";
  var allowed = ["psp", "psx", "segaCD", "segaSaturn", "3do", "segaMD", "nes", "snes", "n64", "gb", "gba", "nds", "mame2003", "arcade", "segaMS", "segaGG", "sega32x", "atari2600", "atari7800", "lynx", "jaguar", "pce", "ngp", "ws", "vb", "coleco"];
  if (allowed.indexOf(core) < 0) return fail("Consola não suportada.");
  if (!url || !/^(https:|blob:)/i.test(url)) return fail("Ficheiro do jogo em falta.");

  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameUrl = url;
  window.EJS_gameName = name;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_threads = !!window.crossOriginIsolated && ["psp", "psx", "n64", "nds", "segaSaturn"].indexOf(core) >= 0;
  // GBA: saltar o ecrã de arranque da BIOS (Nintendo) — evita que alguns jogos fiquem presos aí.
  if (core === "gba") window.EJS_defaultOptions = { "mgba_skip_bios": "ON" };
  // O botão "sair" do emulador volta à página do jogo no GameHub (em vez de ficar dentro do emulador).
  function leave(e) { if (e) { e.preventDefault(); e.stopImmediatePropagation(); } try { parent.postMessage({ gh: "exit" }, "*"); } catch (x) {} }
  // Reconhece o botão "sair" do emulador pelo atributo ou pelo desenho do ícone (porta com seta).
  function isExitBtn(el) {
    try {
      if (!el || !el.closest) return false;
      if (el.closest('[data-btn="exitEmulation"],[data-btn="exit"],[data-btn="exitemulation"]')) return true;
      var svg = el.closest("svg") || (el.children && el.children.length <= 2 && el.querySelector && el.querySelector("svg"));
      return !!(svg && svg.innerHTML && svg.innerHTML.indexOf("7.636414") >= 0);
    } catch (x) { return false; }
  }
  ["click", "pointerup", "touchend", "mouseup"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (isExitBtn(e.target)) leave(e); }, true);
  });
  // Áudio parado até haver um toque (política do navegador) pode deixar o jogo preso no arranque: retoma sempre.
  (function () { try {
    var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    var list = [];
    var W = function () { var c = new (Function.prototype.bind.apply(A, [null].concat([].slice.call(arguments))))(); list.push(c); return c; };
    W.prototype = A.prototype; window.AudioContext = W;
    var wake = function () { list.forEach(function (c) { if (c.state === "suspended") { try { c.resume(); } catch (x) {} } }); };
    ["pointerdown", "touchstart", "keydown", "click"].forEach(function (ev) { document.addEventListener(ev, wake, true); });
    document.addEventListener("visibilitychange", wake); setInterval(wake, 1500);
  } catch (x) {} })();
  // Jogadores 2 e 3 (telemóveis extra) usam teclas próprias; o jogador 1 mantém as predefinidas.
  var K = {2:{b:["n",78],y:["b",66],select:["y",89],start:["p",80],up:["i",73],down:["k",75],left:["j",74],right:["l",76],a:["m",77],x:["c",67],l:["u",85],r:["o",79]},
           3:{b:["2",50],y:["4",52],select:["8",56],start:["7",55],up:["t",84],down:["g",71],left:["f",70],right:["h",72],a:["1",49],x:["3",51],l:["5",53],r:["6",54]}};
  var IDX = {b:0,y:1,select:2,start:3,up:4,down:5,left:6,right:7,a:8,x:9,l:10,r:11};
  // Aplica as teclas dos jogadores 2 e 3 depois do jogo arrancar (sem mexer na configuração inicial do emulador).
  function extraControls() {
    try {
      var em = window.EJS_emulator;
      if (!em || !em.controls) return;
      [2, 3].forEach(function (p) { Object.keys(IDX).forEach(function (b) {
        if (!em.controls[p - 1]) em.controls[p - 1] = {};
        em.controls[p - 1][IDX[b]] = { value: K[p][b][0], value2: "" };
      }); });
    } catch (x) {}
  }
  window.EJS_onGameStart = function () { msg.className = "hide"; extraControls(); try { if (window.EJS_emulator && window.EJS_emulator.on) window.EJS_emulator.on("exit", function () { leave(); }); } catch (x) {} };
  msg.textContent = "A descarregar o jogo… (pode demorar nos ficheiros grandes)";

  var s = document.createElement("script");
  s.src = window.EJS_pathtodata + "loader.js";
  s.onerror = function () { fail("Não foi possível carregar o emulador. Verifica a ligação à Internet."); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
