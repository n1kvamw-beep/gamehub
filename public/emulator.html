<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>GameHub — Emulador</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfd2e3;font-family:system-ui,sans-serif;overflow:hidden}
  #game{width:100%;height:100%}
  #msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.6}
  #msg.hide{display:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="msg">A preparar o emulador…</div>
<script>
(function () {
  var msg = document.getElementById("msg");
  function fail(text) { msg.className = ""; msg.textContent = text; }
  var id = new URLSearchParams(location.search).get("id");
  if (!id) return fail("Jogo não indicado.");

  // Lê o jogo guardado pelo GameHub (IndexedDB "GameHubDB", tabela "games").
  var req = indexedDB.open("GameHubDB");
  req.onerror = function () { fail("Não foi possível abrir a biblioteca local."); };
  req.onsuccess = function () {
    var db = req.result;
    var get = db.transaction("games", "readonly").objectStore("games").get(id);
    get.onerror = function () { fail("Não foi possível ler o jogo."); };
    get.onsuccess = function () {
      var game = get.result;
      if (!game) return fail("Jogo não encontrado na biblioteca.");
      var entry = (game.files || []).find(function (f) { return f.path === game.entry; });
      if (!entry) return fail("Ficheiro do jogo em falta.");
      var name = game.entry.split("/").pop();
      var file = new File([entry.blob], name, { type: "application/octet-stream" });

      window.EJS_player = "#game";
      window.EJS_core = game.system || "psp";
      window.EJS_gameUrl = file;
      window.EJS_gameName = game.name;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_threads = typeof SharedArrayBuffer !== "undefined";
      window.EJS_Buttons = { saveState: true, loadState: true, gamepad: true };
      window.EJS_ready = function () { msg.className = "hide"; };
      window.EJS_onGameStart = function () { msg.className = "hide"; };

      var s = document.createElement("script");
      s.src = window.EJS_pathtodata + "loader.js";
      s.onerror = function () { fail("Não foi possível carregar o emulador. Verifica a ligação à Internet."); };
      document.body.appendChild(s);
    };
  };
})();
</script>
</body>
</html>
